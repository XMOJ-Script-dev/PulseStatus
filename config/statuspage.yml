site:
  name: PulseStatus
  locale: en
  timezone: Asia/Singapore
  defaultTheme: system
  favicon: favicon.svg
  companyName: XMOJ-Script
  companyUrl: https://xmoj-script.uk
  headerText: Public service communications
  footerText: Status updates are published from verified operational data.
  footerLinks:
    - label: GitHub
      url: https://github.com/XMOJ-Script-dev/PulseStatus
repository:
  owner: XMOJ-Script-dev
  name: PulseStatus
monitoring:
  mode: hybrid
  schedule: "*/5 * * * *"
  probeIntervalMinutes: 5
  timeoutMs: 5000
  failuresToDown: 2
  successesToRecover: 2
  autoPublishIncident: true
  failuresToIncident: 3
  recoverySuccessesToCloseIncident: 2
  historyRetentionDays: 90
issues:
  publishLabel: statuspage/incident
  maintenanceLabel: statuspage/maintenance
  lockOfficialIncidents: false
  autoIncidentMentions: [PythonSmall-Q]
  autoIncidentSeverity: major
  trustedMaintainers: [PythonSmall-Q, boomzero, langningchen]
  trustedAssociations: [OWNER, MEMBER, COLLABORATOR]
history:
  initialMonths: 3
  monthsPerLoad: 3
embed:
  enabled: true
  pollIntervalMs: 300000
