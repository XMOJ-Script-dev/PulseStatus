name: PulseStatus
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  discussion:
    types: [created, edited, deleted, transferred, pinned, unpinned, locked, unlocked, category_changed, answered, unanswered]
  discussion_comment:
    types: [created, edited, deleted]
permissions:
  contents: write
  issues: write
  discussions: read
  pages: write
  id-token: write
concurrency:
  group: pulsestatus-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      PULSE_BOT_MODE: ${{ vars.PULSE_BOT_MODE || 'actions' }}
      PULSE_APP_ID: ${{ secrets.PULSE_APP_ID }}
      PULSE_APP_PRIVATE_KEY: ${{ secrets.PULSE_APP_PRIVATE_KEY }}
    steps:
      - name: Create optional GitHub App token
        id: automation-token
        continue-on-error: true
        if: env.PULSE_BOT_MODE == 'app' && env.PULSE_APP_ID != '' && env.PULSE_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v1.11.0
        with:
          app-id: ${{ env.PULSE_APP_ID }}
          private-key: ${{ env.PULSE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Fall back to github-actions
        if: steps.automation-token.outcome == 'failure' || (env.PULSE_BOT_MODE == 'app' && (env.PULSE_APP_ID == '' || env.PULSE_APP_PRIVATE_KEY == ''))
        run: echo "::warning::GitHub App token creation failed. Falling back to the built-in GITHUB_TOKEN. Verify that the App is installed on ${{ github.repository }} and has Contents and Issues write permissions."
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ steps.automation-token.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate-config
      - name: Sync GitHub Issues
        env:
          GITHUB_TOKEN: ${{ steps.automation-token.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULSE_SERVICES: web,api,assets,docs
          PULSE_TRUSTED_MAINTAINERS: ${{ vars.PULSE_TRUSTED_MAINTAINERS }}
        run: npm run sync-issues
      - run: npm run check-services
        env:
          PULSE_MONITOR_MODE: manual
      - name: Publish automated incidents
        env:
          GITHUB_TOKEN: ${{ steps.automation-token.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run auto-publish-incidents
      - name: Persist monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/monitor-state.json
          git diff --cached --quiet || (git commit -m "chore: persist monitor state [skip ci]" && git push)
      - run: npm run build-data && npm run generate-badges
        env:
          PULSE_MONITOR_MODE: hybrid
      - run: npm run build
        env:
          VITE_BASE_PATH: /PulseStatus/
      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist
      - uses: actions/deploy-pages@v4.0.5
