<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · PulseStatus</title>
  <link rel="icon" href="favicon.png">
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #17243d; background: #f6f8fc; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { text-align: center; padding: 24px; }
    .mark { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: #fff; background: linear-gradient(135deg, #6366f1, #4338ca); font-weight: 800; }
    h1 { margin: 18px 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 20px; color: #5c6b82; }
    a { color: #6366f1; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      :root { color: #e5e7eb; background: #101827; }
      p { color: #a9b6cc; }
    }
  </style>
</head>
<body>
  <main>
    <span class="mark">P</span>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or was moved.</p>
    <a href="./">← Back to the status overview</a>
  </main>
</body>
</html>
